<!doctype html>
<html lang="en">
  <head>
    {{- partial "head.html" . -}}
  </head>
  <body class="{{ if .IsHome }}home{{ else }}interior{{ end }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {{- partial "header.html" . -}}
    <main id="main">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </body>
</html>
