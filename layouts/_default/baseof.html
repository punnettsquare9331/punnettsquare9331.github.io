<!doctype html>
<html lang="en">
  <head>
    {{- partial "head.html" . -}}
  </head>
  <body class="{{ if .IsHome }}home{{ else }}interior{{ end }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {{- partial "header.html" . -}}
    <main id="main">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" defer></script>
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </body>
</html>
