<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

{{- $title := cond .IsHome "Puneet Velidi | Statistical AI/ML Researcher" (printf "%s | Puneet Velidi" .Title) -}}
{{- $description := .Description | default site.Params.description -}}
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="Puneet Velidi">
<meta property="og:image" content="{{ "images/puneet-portrait.jpg" | absURL }}">
<meta property="og:image:alt" content="Puneet Velidi — Statistical AI/ML Researcher and founder at ChimeraML">

<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@velidictorian">
<meta name="twitter:creator" content="@velidictorian">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ "images/puneet-portrait.jpg" | absURL }}">

<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">

{{- $styles := resources.Get "css/extended/portfolio.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
