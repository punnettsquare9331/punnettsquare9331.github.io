<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf6">
<meta name="color-scheme" content="light">

{{- $title := cond .IsHome "Puneet Velidi | Statistics & Computational Research" (printf "%s | Puneet Velidi" .Title) -}}
{{- $description := .Description | default site.Params.description -}}
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="Puneet Velidi">
<meta property="og:image" content="{{ "images/puneet-velidi-og.png" | absURL }}">
<meta property="og:image:alt" content="Puneet Velidi — statistics and computational research">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@velidictorian">
<meta name="twitter:creator" content="@velidictorian">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ "images/puneet-velidi-og.png" | absURL }}">

<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

{{- $styles := resources.Get "css/extended/portfolio.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
<noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
