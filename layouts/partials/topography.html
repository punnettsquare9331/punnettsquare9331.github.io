<figure class="landscape" aria-label="A ball descending an ASCII loss landscape" aria-describedby="landscape-caption">
  <div class="landscape-heading"><span aria-hidden="true">[01]</span>loss_landscape<span data-loss-state>[ illustration ]</span></div>
  <div class="landscape-surface">
    <pre class="landscape-fallback" aria-hidden="true">
      . : + # # + : .
   . : + #       # + : .
 . : + #   o       # + : .
: + #      .        # + :
 + #        .     # + :
  #          .  # + :
   + .        + : .
     : + . . : .
        : : .
    </pre>
    <canvas id="landscape-canvas" width="800" height="800" aria-hidden="true"></canvas>
  </div>
  <div class="landscape-readout">
    <span>step <b data-loss-step>—</b></span>
    <span>loss <b data-loss-value>—</b></span>
    <button type="button" data-loss-restart aria-label="Restart loss landscape descent" hidden>[ restart ]</button>
  </div>
  <figcaption id="landscape-caption"><span>Gradient descent / illustrative</span><span class="landscape-hint">Move to orbit</span></figcaption>
</figure>
